<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Explorador de Séries</title>
    <link rel="stylesheet" href="style.css">

  </head>
  <body>
    <main class="container">
      <header>
        <h1>Explorador de Séries</h1>
        <p class="tagline">Busque séries por nome e veja detalhes úteis (poster, ano, nota, resumo).</p>
      </header>

      <section class="search">
        <input id="campo-busca" type="search" placeholder="Digite o nome da série (ex: friends)" aria-label="Buscar série">
        <button id="botao-buscar">Buscar</button>
      </section>

      <section id="resultado" class="resultado">
        <p class="hint">Digite um termo e clique em Buscar para ver resultados.</p>
      </section>

      <footer>
        <small>API usada: TVMaze (https://api.tvmaze.com/). Projeto de exemplo.</small>
      </footer>
    </main>

    <!-- Adiciona query string para evitar cache antigo do navegador -->
    <script src="script.js?v=2"></script>
  </body>
</html>
