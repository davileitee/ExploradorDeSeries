<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Explorador de Séries</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Explorador de Séries</h1>
        <p class="tagline">Busque séries por nome e veja detalhes úteis (poster, ano, nota, resumo).</p>
      </header>

      <section class="search">
        <input id="campo-busca" type="search" placeholder="Digite o nome da série (ex: friends)" aria-label="Buscar série">
        <button id="botao-buscar" type="button">Buscar</button>
      </section>

      <section id="resultado" class="resultado" aria-live="polite">
        <p class="hint">Digite um termo e clique em Buscar para ver resultados.</p>
      </section>

      <section class="saved-series" aria-live="polite">
        <h2>Minhas séries salvas</h2>
        <div id="series-salvas" class="saved-list">
          <p class="hint">Carregando suas séries salvas…</p>
        </div>
      </section>

      <footer>
        <small>API usada: TVMaze (https://api.tvmaze.com/). Projeto de exemplo.</small>
      </footer>
    </main>

    <script type="module" src="script.js?v=3"></script>
  </body>
</html>
